<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title desc"><title id="title">Two hybrids use the same layer rhythm</title><desc id="desc">Each column shows three recurrent layers followed by one explicit attention layer. Qwen3-Next uses Gated DeltaNet plus gated softmax attention. Kimi Linear uses KDA plus full MLA.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203044"/></marker></defs><rect width="1120" height="600" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="32" y="48" font-size="28" text-anchor="start" font-weight="600" fill="#203044">Two hybrids use the same layer rhythm</text><text x="60" y="99" font-size="25" text-anchor="start" font-weight="600" fill="#203044">Qwen3-Next</text><text x="590" y="99" font-size="25" text-anchor="start" font-weight="600" fill="#203044">Kimi Linear</text><rect x="60" y="130" width="470" height="56" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="295" y="166" font-size="21" text-anchor="middle" font-weight="500" fill="#203044">Gated DeltaNet</text><path d="M 295 187 L 295 203" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="206" width="470" height="56" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="295" y="242" font-size="21" text-anchor="middle" font-weight="500" fill="#203044">Gated DeltaNet</text><path d="M 295 263 L 295 279" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="282" width="470" height="56" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="295" y="318" font-size="21" text-anchor="middle" font-weight="500" fill="#203044">Gated DeltaNet</text><path d="M 295 339 L 295 355" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="358" width="470" height="56" rx="14" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><text x="295" y="394" font-size="21" text-anchor="middle" font-weight="500" fill="#203044">GQA + softmax output gate</text><text x="60" y="474" font-size="18" text-anchor="start" font-weight="400" fill="#203044">First three: bounded recurrent state</text><text x="60" y="503" font-size="18" text-anchor="start" font-weight="400" fill="#203044">Fourth: addressable historical entries</text><rect x="590" y="130" width="470" height="56" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="825" y="166" font-size="21" text-anchor="middle" font-weight="500" fill="#203044">Kimi Delta Attention</text><path d="M 825 187 L 825 203" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="590" y="206" width="470" height="56" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="825" y="242" font-size="21" text-anchor="middle" font-weight="500" fill="#203044">Kimi Delta Attention</text><path d="M 825 263 L 825 279" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="590" y="282" width="470" height="56" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="825" y="318" font-size="21" text-anchor="middle" font-weight="500" fill="#203044">Kimi Delta Attention</text><path d="M 825 339 L 825 355" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="590" y="358" width="470" height="56" rx="14" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><text x="825" y="394" font-size="21" text-anchor="middle" font-weight="500" fill="#203044">Full MLA attention</text><text x="590" y="474" font-size="18" text-anchor="start" font-weight="400" fill="#203044">First three: bounded recurrent state</text><text x="590" y="503" font-size="18" text-anchor="start" font-weight="400" fill="#203044">Fourth: addressable historical entries</text><text x="32" y="562" font-size="18" text-anchor="start" font-weight="400" fill="#5c6b7d">One repeating group shown; feed-forward blocks and residual paths omitted.</text></g></svg>