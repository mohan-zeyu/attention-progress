<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 335" role="img" aria-labelledby="title desc">
<title id="title">08-stacks</title><desc id="desc">One repeating group in Qwen3-Next has three Gated DeltaNet layers plus gated global GQA; Kimi Linear has three KDA layers plus full MLA. Residual and feed-forward operations are omitted.</desc>
<defs>
