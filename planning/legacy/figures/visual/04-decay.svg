<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">04-decay</title><desc id="desc">RetNet uses fixed retention factors per head. GLA makes state forgetting input dependent; the illustrated variant decays key channels separately.</desc>
<defs>
