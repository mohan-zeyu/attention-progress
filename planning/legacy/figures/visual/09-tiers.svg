<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">09-tiers</title><desc id="desc">Computed compatible prefixes can be retained in GPU, host RAM or SSD. Reuse may save recomputation, while loading has transfer costs. Persistence alone is not semantic memory.</desc>
<defs>
