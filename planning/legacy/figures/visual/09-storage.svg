<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">09-storage</title><desc id="desc">Sharing cache sets across layers reduces repeated storage. Quantizing sixteen-bit elements to four bits reduces raw element bits fourfold, before metadata and numerical costs.</desc>
