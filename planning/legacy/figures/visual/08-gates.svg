<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" role="img" aria-labelledby="title desc">
<title id="title">08-gates</title><desc id="desc">An output gate modulates this readout after attention. A state gate alters carried memory and therefore future reads. Both can coexist in a recurrent layer.</desc>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#253340"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#687986"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4287b9"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#209f78"/></marker>
<marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d49a30"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#cf6c66"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9272b7"/></marker>
</defs>
<rect width="900" height="285" fill="white"/>
<text x="225" y="33" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#253340">Gate the output</text>
<rect x="33" y="105" width="133" height="53" rx="7" fill="#f3f6f7" fill-opacity="1" stroke="#4287b9" stroke-width="1.7"/>
<text x="99.5" y="138.85" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#4287b9">Attention</text>
<line x1="170" y1="131" x2="210" y2="131" stroke="#687986" stroke-width="2" marker-end="url(#a-muted)"/>
<circle cx="239" cy="131" r="24" fill="#ffffff" stroke="#d49a30" stroke-width="2"/>
<text x="239" y="138.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#d49a30">×</text>
<line x1="239" y1="66" x2="239" y2="103" stroke="#d49a30" stroke-width="2" marker-end="url(#a-gold)"/>
<text x="239" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#d49a30">Gate</text>
<line x1="268" y1="131" x2="316" y2="131" stroke="#687986" stroke-width="2" marker-end="url(#a-muted)"/>
<rect x="321" y="105" width="93" height="53" rx="7" fill="#f3f6f7" fill-opacity="1" stroke="#209f78" stroke-width="1.7"/>
<text x="367.5" y="138.85" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#209f78">Out</text>
<text x="225" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#209f78">Changes this readout</text>
<text x="675" y="33" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#253340">Gate the state</text>
<line x1="450" y1="32" x2="450" y2="260" stroke="#cad5db" stroke-width="2"/>
<rect x="479" y="91" width="25" height="25" rx="2" fill="#9272b7" fill-opacity="0.25"/>
<rect x="506" y="91" width="25" height="25" rx="2" fill="#9272b7" fill-opacity="0.49375"/>
<rect x="533" y="91" width="25" height="25" rx="2" fill="#9272b7" fill-opacity="0.7375"/>
<rect x="479" y="118" width="25" height="25" rx="2" fill="#9272b7" fill-opacity="0.81875"/>
<rect x="506" y="118" width="25" height="25" rx="2" fill="#9272b7" fill-opacity="0.33125"/>
<rect x="533" y="118" width="25" height="25" rx="2" fill="#9272b7" fill-opacity="0.575"/>
<rect x="479" y="145" width="25" height="25" rx="2" fill="#9272b7" fill-opacity="0.65625"/>
<rect x="506" y="145" width="25" height="25" rx="2" fill="#9272b7" fill-opacity="0.9"/>
<rect x="533" y="145" width="25" height="25" rx="2" fill="#9272b7" fill-opacity="0.4125"/>
<line x1="565" y1="130" x2="609" y2="130" stroke="#687986" stroke-width="2" marker-end="url(#a-muted)"/>
<circle cx="637" cy="130" r="24" fill="#ffffff" stroke="#d49a30" stroke-width="2"/>
<text x="637" y="137.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#d49a30">×</text>
<line x1="637" y1="66" x2="637" y2="103" stroke="#d49a30" stroke-width="2" marker-end="url(#a-gold)"/>
<text x="637" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#d49a30">Gate</text>
<line x1="664" y1="130" x2="708" y2="130" stroke="#687986" stroke-width="2" marker-end="url(#a-muted)"/>
<rect x="714" y="104" width="149" height="53" rx="7" fill="#f3f6f7" fill-opacity="1" stroke="#209f78" stroke-width="1.7"/>
<text x="788.5" y="137.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#209f78">Update state</text>
<text x="675" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#209f78">Changes future reads</text>
</svg>
