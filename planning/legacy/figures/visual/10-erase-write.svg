<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
<title id="title">10-erase-write</title><desc id="desc">Gated DeltaNet-2 gates the key before the erase read, and gates the incoming value before forming the write target. Their residual corrects the faded state. The gate is not applied after the erase read.</desc>
