<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">09-execution</title><desc id="desc">FLA implements multiple recurrent rules with efficient chunkwise kernels. Ring Attention distributes dense context across devices while circulating KV blocks; scheduling is distinct from the attention rule.</desc>
