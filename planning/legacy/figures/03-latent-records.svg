<text x="295" y="222" class="small" text-anchor="middle">project</text>
<rect x="370" y="205" width="177" height="66" rx="10" fill="#eaf5f0" stroke="#cbd5e1"/>
<text x="458" y="234" class="body" text-anchor="middle">c2 ∈ Rᵈᶜ</text>
<text x="458" y="257" class="small" text-anchor="middle">content latent</text>
<rect x="557" y="205" width="132" height="66" rx="10" fill="#f1edfa" stroke="#cbd5e1"/>
<text x="623" y="234" class="body" text-anchor="middle">kR2 ∈ Rᵈʳ</text>
<text x="623" y="257" class="small" text-anchor="middle">positional key</text>
