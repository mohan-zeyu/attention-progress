<text x="785" y="139" class="label" text-anchor="start">Conceptual content projections</text>
<text x="785" y="171" class="body" text-anchor="start">key head i:  Ai cj ∈ Rᵈᵏ</text>
<text x="785" y="199" class="body" text-anchor="start">value head i:  Ui cj ∈ Rᵈᵛ</text>
<text x="765" y="234" class="small" text-anchor="start">Content uses cj; position uses kRj.</text>
<rect x="765" y="245" width="275" height="121" rx="10" fill="#fafbfd" stroke="#cbd5e1"/>
<text x="785" y="278" class="label" text-anchor="start">With projection absorption</text>
<text x="785" y="308" class="body" text-anchor="start">match / read directly in</text>
<text x="785" y="334" class="body" text-anchor="start">latent content coordinates</text>
<text x="785" y="356" class="small" text-anchor="start">(next diagram)</text>
<text x="40" y="417" class="body" text-anchor="start">More positions → more rows. A smaller content basis does not make the row count constant.</text>
<text x="40" y="459" class="small" text-anchor="start">Cache width per row per layer: dc + dr elements. This illustration shows three positions; an actual cache holds N.</text>
