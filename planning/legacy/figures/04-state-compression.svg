<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" role="img" aria-labelledby="title desc"><title id="title">History entries versus a fixed working state</title><desc id="desc">The left stores Tuesday, Friday, and unrelated messages as separate entries. The right accumulates contributions in a fixed value-by-key-channel matrix S and a normalization vector z.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203044"/></marker></defs><rect width="1120" height="540" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="32" y="48" font-size="28" text-anchor="start" font-weight="600" fill="#203044">History entries versus a fixed working state</text><rect x="32" y="105" width="432" height="324" rx="14" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="646" y="105" width="442" height="324" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="56" y="145" font-size="24" text-anchor="start" font-weight="600" fill="#203044">Individually stored positions</text><rect x="56" y="175" width="384" height="49" rx="14" fill="white" stroke="#d7dee8" stroke-width="1.5"/><text x="76" y="207" font-size="21" text-anchor="start" font-weight="400" fill="#203044">order 7314 → Tuesday</text><rect x="56" y="242" width="384" height="49" rx="14" fill="white" stroke="#d7dee8" stroke-width="1.5"/><text x="76" y="274" font-size="21" text-anchor="start" font-weight="400" fill="#203044">order 7314 → Friday</text><rect x="56" y="309" width="384" height="49" rx="14" fill="white" stroke="#d7dee8" stroke-width="1.5"/><text x="76" y="341" font-size="21" text-anchor="start" font-weight="400" fill="#203044">unrelated messages …</text><text x="56" y="399" font-size="19" text-anchor="start" font-weight="400" fill="#5c6b7d">More positions → more entries</text><path d="M 485 263 L 623 263" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><text x="554" y="198" font-size="19" text-anchor="middle" font-weight="400" fill="#203044">Update</text><text x="554" y="227" font-size="19" text-anchor="middle" font-weight="400" fill="#203044">summary</text><text x="670" y="145" font-size="24" text-anchor="start" font-weight="600" fill="#203044">Recurrent working state</text><text x="712" y="188" font-size="18" text-anchor="start" font-weight="400" fill="#203044">S: value × key channels</text><text x="973" y="188" font-size="20" text-anchor="middle" font-weight="400" fill="#203044">z</text><rect x="712" y="207" width="32" height="35" rx="4" fill="#f1edfa" stroke="#d7dee8" stroke-width="1.5"/><rect x="750" y="207" width="32" height="35" rx="4" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="788" y="207" width="32" height="35" rx="4" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="826" y="207" width="32" height="35" rx="4" fill="#f1edfa" stroke="#d7dee8" stroke-width="1.5"/><rect x="864" y="207" width="32" height="35" rx="4" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="712" y="248" width="32" height="35" rx="4" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="750" y="248" width="32" height="35" rx="4" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="788" y="248" width="32" height="35" rx="4" fill="#f1edfa" stroke="#d7dee8" stroke-width="1.5"/><rect x="826" y="248" width="32" height="35" rx="4" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="864" y="248" width="32" height="35" rx="4" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="712" y="289" width="32" height="35" rx="4" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="750" y="289" width="32" height="35" rx="4" fill="#f1edfa" stroke="#d7dee8" stroke-width="1.5"/><rect x="788" y="289" width="32" height="35" rx="4" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="826" y="289" width="32" height="35" rx="4" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="864" y="289" width="32" height="35" rx="4" fill="#f1edfa" stroke="#d7dee8" stroke-width="1.5"/><rect x="956" y="207" width="32" height="20" rx="4" fill="#fbf1e5" stroke="#d7dee8" stroke-width="1.5"/><rect x="956" y="232" width="32" height="20" rx="4" fill="#fbf1e5" stroke="#d7dee8" stroke-width="1.5"/><rect x="956" y="257" width="32" height="20" rx="4" fill="#fbf1e5" stroke="#d7dee8" stroke-width="1.5"/><rect x="956" y="282" width="32" height="20" rx="4" fill="#fbf1e5" stroke="#d7dee8" stroke-width="1.5"/><rect x="956" y="307" width="32" height="20" rx="4" fill="#fbf1e5" stroke="#d7dee8" stroke-width="1.5"/><text x="670" y="368" font-size="19" text-anchor="start" font-weight="400" fill="#203044">Outer-product accumulation</text><text x="670" y="397" font-size="19" text-anchor="start" font-weight="400" fill="#203044">plus a normalization sum</text><text x="32" y="493" font-size="20" text-anchor="start" font-weight="600" fill="#203044">Same growing conversation</text><text x="646" y="493" font-size="20" text-anchor="start" font-weight="600" fill="#203044">State shape stays fixed as N grows</text></g></svg>