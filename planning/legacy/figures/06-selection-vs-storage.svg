<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 578" role="img" aria-labelledby="title desc"><title id="title">Sparse access is not cache deletion</title><desc id="desc">A lightweight indexer scores stored historical entries and passes selected entries to main attention. Unselected entries remain cached; selector and read costs are separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#203044"/></marker></defs><rect width="1200" height="578" fill="#fff"/><text x="30" y="43" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#203044" text-anchor="start">Sparse access changes the read, not automatically the stored history</text><text x="30" y="75" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#66758b" text-anchor="start">DSA-style selection: small scores choose entries for the more expensive attention operation.</text><rect x="28" y="113" width="1143" height="116" rx="12" fill="#e5edf8" stroke="#c7d2e1" stroke-width="1.5"/><text x="47" y="144" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">Stored history · all selectable records remain available</text><rect x="50" y="162" width="75" height="45" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="87" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c1</text><rect x="141" y="162" width="75" height="45" rx="12" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><text x="178" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c2</text><rect x="232" y="162" width="75" height="45" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="269" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c3</text><rect x="323" y="162" width="75" height="45" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="360" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c4</text><rect x="414" y="162" width="75" height="45" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="451" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c5</text><rect x="505" y="162" width="75" height="45" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="542" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c6</text><rect x="596" y="162" width="75" height="45" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="633" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c7</text><rect x="687" y="162" width="75" height="45" rx="12" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><text x="724" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c8</text><rect x="778" y="162" width="75" height="45" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="815" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c9</text><rect x="869" y="162" width="75" height="45" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="906" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c10</text><rect x="960" y="162" width="75" height="45" rx="12" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><text x="997" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c11</text><rect x="1051" y="162" width="75" height="45" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="1088" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">c12</text><rect x="52" y="302" width="303" height="118" rx="12" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><text x="73" y="334" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#203044" text-anchor="start">Lightweight indexer</text><text x="73" y="365" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="start">Score preceding positions</text><text x="73" y="394" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="start">Select top-k indices</text><rect x="472" y="302" width="290" height="118" rx="12" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><text x="493" y="334" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#203044" text-anchor="start">Gather selected entries</text><text x="493" y="368" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#203044" text-anchor="start">c2      c8      c11</text><text x="493" y="395" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#66758b" text-anchor="start">Illustrative k = 3</text><rect x="878" y="302" width="293" height="118" rx="12" fill="#fbf1e5" stroke="#c7d2e1" stroke-width="1.5"/><text x="899" y="334" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#203044" text-anchor="start">Main attention read</text><text x="899" y="365" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="start">Selected KV + query</text><text x="899" y="395" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="start">Produce output</text><line x1="204" y1="229" x2="204" y2="291" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><line x1="365" y1="360" x2="462" y2="360" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><line x1="772" y1="360" x2="868" y2="360" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><path d="M 617 229 L 617 291" fill="none" stroke="#203044" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="28" y="465" width="1143" height="76" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="50" y="496" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">Count both costs: selector work + main-attention work.</text><text x="50" y="524" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#66758b" text-anchor="start">DSA: O(N²) selector work over a full sequence; O(Nk) selected main attention.</text></svg>
