<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="1120" height="630" role="img" aria-labelledby="title desc"><title id="title">Independent erase and write controls</title><desc id="desc">A decayed memory feeds a key-channel-gated erase read. Independently, a value-channel gate produces the new target. Their difference is written along the original key direction.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203044"/></marker></defs><rect width="1120" height="630" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="32" y="48" font-size="28" text-anchor="start" font-weight="600" fill="#203044">Independent erase and write controls</text><rect x="34" y="105" width="280" height="132" rx="14" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><text x="56" y="147" font-size="21" text-anchor="start" font-weight="500" fill="#203044">1 · Decay old memory</text><text x="56" y="189" font-size="21" text-anchor="start" font-weight="500" fill="#203044">S̄ = S_previous D</text><path d="M 315 171 L 361 171" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="364" y="105" width="330" height="132" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="386" y="147" font-size="21" text-anchor="start" font-weight="400" fill="#203044">Faded memory S̄</text><text x="386" y="189" font-size="20" text-anchor="start" font-weight="400" fill="#203044">Used for the erase read</text><rect x="754" y="105" width="330" height="132" rx="14" fill="#fbf1e5" stroke="#d7dee8" stroke-width="1.5"/><text x="776" y="147" font-size="21" text-anchor="start" font-weight="400" fill="#203044">Incoming value v</text><text x="776" y="189" font-size="20" text-anchor="start" font-weight="400" fill="#203044">Has an independent gate</text><path d="M 530 238 L 530 277" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><path d="M 918 238 L 918 277" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="364" y="280" width="330" height="125" rx="14" fill="#f1edfa" stroke="#d7dee8" stroke-width="1.5"/><text x="386" y="317" font-size="20" text-anchor="start" font-weight="400" fill="#203044">2 · Gated erase read</text><text x="386" y="348" font-size="20" text-anchor="start" font-weight="400" fill="#203044">e = b ⊙ k</text><text x="386" y="379" font-size="20" text-anchor="start" font-weight="400" fill="#203044">Old content = S̄ e</text><rect x="754" y="280" width="330" height="125" rx="14" fill="#fbf1e5" stroke="#d7dee8" stroke-width="1.5"/><text x="776" y="317" font-size="20" text-anchor="start" font-weight="400" fill="#203044">3 · Gated write target</text><text x="776" y="348" font-size="20" text-anchor="start" font-weight="400" fill="#203044">z = w ⊙ v</text><text x="776" y="379" font-size="20" text-anchor="start" font-weight="400" fill="#203044">New target = z</text><path d="M 530 406 L 530 445" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><path d="M 918 406 L 918 445" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="364" y="448" width="720" height="97" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="389" y="484" font-size="21" text-anchor="start" font-weight="400" fill="#203044">4 · Correct along the original key direction</text><text x="389" y="519" font-size="21" text-anchor="start" font-weight="400" fill="#203044">S_new = S̄ + (z − S̄ e) kᵀ</text><text x="34" y="321" font-size="19" text-anchor="start" font-weight="400" fill="#203044">b: key-channel gate</text><text x="34" y="355" font-size="19" text-anchor="start" font-weight="400" fill="#203044">w: value-channel gate</text><text x="34" y="389" font-size="19" text-anchor="start" font-weight="400" fill="#203044">Independent controls</text><text x="34" y="592" font-size="18" text-anchor="start" font-weight="400" fill="#5c6b7d">Gated DeltaNet-2: fading, the erase read, and the value target are separate controls.</text></g></svg>