<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 697" role="img" aria-labelledby="title desc"><title id="title">Compress the history, then choose how to read</title><desc id="desc">CSA compresses moderately, selects historical records, and includes a local uncompressed window. HCA compresses more strongly and reads all eligible compressed records with the same local detail path.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#203044"/></marker></defs><rect width="1200" height="697" fill="#fff"/><text x="30" y="43" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#203044" text-anchor="start">Compress the sequence, then choose the historical read</text><text x="30" y="75" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#66758b" text-anchor="start">Both paths use the same compressed entry as key and value; multiple query heads share it.</text><rect x="28" y="117" width="1143" height="198" rx="12" fill="#e5edf8" stroke="#c7d2e1" stroke-width="1.5"/><text x="48" y="149" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#203044" text-anchor="start">CSA · moderate compression + selected history</text><rect x="48" y="175" width="254" height="110" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="64" y="203" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">Learned pooling</text><text x="64" y="231" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203044" text-anchor="start">Many source positions</text><text x="64" y="260" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203044" text-anchor="start">→ fewer historical records</text><rect x="374" y="175" width="306" height="110" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="392" y="203" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">Historical access</text><text x="392" y="231" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="start">Indexer scores → top-k</text><rect x="395" y="248" width="27" height="21" rx="3" fill="#f6f8fb" stroke="#c7d2e1" stroke-width="1.5"/><rect x="431" y="248" width="27" height="21" rx="3" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><rect x="467" y="248" width="27" height="21" rx="3" fill="#f6f8fb" stroke="#c7d2e1" stroke-width="1.5"/><rect x="503" y="248" width="27" height="21" rx="3" fill="#f6f8fb" stroke="#c7d2e1" stroke-width="1.5"/><rect x="539" y="248" width="27" height="21" rx="3" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><rect x="575" y="248" width="27" height="21" rx="3" fill="#f6f8fb" stroke="#c7d2e1" stroke-width="1.5"/><rect x="611" y="248" width="27" height="21" rx="3" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><rect x="752" y="175" width="395" height="110" rx="12" fill="#fbf1e5" stroke="#c7d2e1" stroke-width="1.5"/><text x="770" y="203" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">Core attention</text><text x="770" y="231" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="start">Historical records + local records</text><text x="770" y="260" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203044" text-anchor="start">One read → output per query head</text><line x1="312" y1="229" x2="364" y2="229" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><line x1="690" y1="229" x2="742" y2="229" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="343" width="1143" height="198" rx="12" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><text x="48" y="375" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#203044" text-anchor="start">HCA · stronger compression + all compressed history</text><rect x="48" y="401" width="254" height="110" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="64" y="429" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">Learned pooling</text><text x="64" y="457" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203044" text-anchor="start">Many source positions</text><text x="64" y="486" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203044" text-anchor="start">→ fewer historical records</text><rect x="374" y="401" width="306" height="110" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="392" y="429" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">Historical access</text><text x="392" y="457" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="start">Read every completed record</text><rect x="395" y="474" width="27" height="21" rx="3" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><rect x="431" y="474" width="27" height="21" rx="3" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><rect x="467" y="474" width="27" height="21" rx="3" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><rect x="503" y="474" width="27" height="21" rx="3" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><rect x="539" y="474" width="27" height="21" rx="3" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><rect x="575" y="474" width="27" height="21" rx="3" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><rect x="611" y="474" width="27" height="21" rx="3" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><rect x="752" y="401" width="395" height="110" rx="12" fill="#fbf1e5" stroke="#c7d2e1" stroke-width="1.5"/><text x="770" y="429" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">Core attention</text><text x="770" y="457" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="start">Historical records + local records</text><text x="770" y="486" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203044" text-anchor="start">One read → output per query head</text><line x1="312" y1="455" x2="364" y2="455" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><line x1="690" y1="455" x2="742" y2="455" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="575" width="490" height="90" rx="12" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><text x="47" y="606" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#203044" text-anchor="start">Recent uncompressed window</text><text x="47" y="637" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203044" text-anchor="start">Preserves local detail and unfinished-block context</text><path d="M 528 617 L 1182 617 L 1182 264 L 1147 264" fill="none" stroke="#203044" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 1182 487 L 1147 487" fill="none" stroke="#203044" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="593" y="607" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#66758b" text-anchor="start">Local records enter both core reads</text></svg>
