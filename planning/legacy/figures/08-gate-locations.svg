<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" width="1120" height="610" role="img" aria-labelledby="title desc"><title id="title">A gate after attention and a gate inside memory</title><desc id="desc">The left gate multiplies a computed attention readout. The right gate modifies a carried recurrent matrix before the delta correction. Output gating can also coexist with state gating in a recurrent layer.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203044"/></marker></defs><rect width="1120" height="610" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="32" y="48" font-size="28" text-anchor="start" font-weight="600" fill="#203044">A gate after attention and a gate inside memory</text><rect x="32" y="105" width="510" height="423" rx="14" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><rect x="578" y="105" width="510" height="423" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="58" y="143" font-size="24" text-anchor="start" font-weight="600" fill="#203044">Output gate</text><text x="604" y="143" font-size="24" text-anchor="start" font-weight="600" fill="#203044">State gate</text><rect x="74" y="177" width="426" height="65" rx="14" fill="white" stroke="#d7dee8" stroke-width="1.5"/><text x="287" y="218" font-size="21" text-anchor="middle" font-weight="400" fill="#203044">Compute attention readout a</text><path d="M 287 243 L 287 278" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="280" width="426" height="69" rx="14" fill="#f1edfa" stroke="#d7dee8" stroke-width="1.5"/><text x="287" y="322" font-size="21" text-anchor="middle" font-weight="400" fill="#203044">Multiply by output gate g</text><path d="M 287 350 L 287 385" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="387" width="426" height="65" rx="14" fill="white" stroke="#d7dee8" stroke-width="1.5"/><text x="287" y="428" font-size="21" text-anchor="middle" font-weight="400" fill="#203044">Send gated features forward</text><text x="58" y="488" font-size="17" text-anchor="start" font-weight="400" fill="#203044">Changes this output; attention was computed.</text><rect x="620" y="177" width="426" height="65" rx="14" fill="white" stroke="#d7dee8" stroke-width="1.5"/><text x="833" y="218" font-size="21" text-anchor="middle" font-weight="400" fill="#203044">Carry prior matrix S</text><path d="M 833 243 L 833 278" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="280" width="426" height="69" rx="14" fill="#f1edfa" stroke="#d7dee8" stroke-width="1.5"/><text x="833" y="322" font-size="21" text-anchor="middle" font-weight="400" fill="#203044">Decay columns, then correct</text><path d="M 833 350 L 833 385" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="387" width="426" height="65" rx="14" fill="white" stroke="#d7dee8" stroke-width="1.5"/><text x="833" y="428" font-size="21" text-anchor="middle" font-weight="400" fill="#203044">Carry updated S to future tokens</text><text x="604" y="488" font-size="17" text-anchor="start" font-weight="400" fill="#203044">Changes persistent memory, including future reads.</text><text x="32" y="572" font-size="18" text-anchor="start" font-weight="400" fill="#5c6b7d">A recurrent layer may also gate its readout. The locations are distinct operations.</text></g></svg>