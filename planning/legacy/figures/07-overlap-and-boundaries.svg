<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">CSA overlap changes source coverage, not output stride</title><desc id="desc">Three blocks of four source positions yield three compressed records. Interior records pool two adjacent blocks using separate projected contributions, so records emitted every four positions overlap in source coverage.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#203044"/></marker></defs><rect width="1200" height="630" fill="#fff"/><text x="30" y="43" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#203044" text-anchor="start">CSA overlap: eight source positions, one record every four</text><text x="30" y="75" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#66758b" text-anchor="start">Illustrative ratio r = 4. Completed output count is N/r, not N/(2r).</text><text x="32" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#203044" text-anchor="start">Source positions</text><rect x="32" y="147" width="77" height="47" rx="12" fill="#e5edf8" stroke="#c7d2e1" stroke-width="1.5"/><text x="70" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">1</text><rect x="126" y="147" width="77" height="47" rx="12" fill="#e5edf8" stroke="#c7d2e1" stroke-width="1.5"/><text x="164" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">2</text><rect x="220" y="147" width="77" height="47" rx="12" fill="#e5edf8" stroke="#c7d2e1" stroke-width="1.5"/><text x="258" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">3</text><rect x="314" y="147" width="77" height="47" rx="12" fill="#e5edf8" stroke="#c7d2e1" stroke-width="1.5"/><text x="352" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">4</text><rect x="408" y="147" width="77" height="47" rx="12" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><text x="446" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">5</text><rect x="502" y="147" width="77" height="47" rx="12" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><text x="540" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">6</text><rect x="596" y="147" width="77" height="47" rx="12" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><text x="634" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">7</text><rect x="690" y="147" width="77" height="47" rx="12" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><text x="728" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">8</text><rect x="784" y="147" width="77" height="47" rx="12" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><text x="822" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">9</text><rect x="878" y="147" width="77" height="47" rx="12" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><text x="916" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">10</text><rect x="972" y="147" width="77" height="47" rx="12" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><text x="1010" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">11</text><rect x="1066" y="147" width="77" height="47" rx="12" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><text x="1104" y="178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203044" text-anchor="middle">12</text><text x="210" y="224" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#203044" text-anchor="middle">Block A</text><text x="586" y="224" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#203044" text-anchor="middle">Block B</text><text x="962" y="224" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#203044" text-anchor="middle">Block C</text><rect x="32" y="267" width="329" height="48" rx="12" fill="#e5edf8" stroke="#c7d2e1" stroke-width="1.5"/><text x="46" y="297" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#203044" text-anchor="start">Entry 1: A only</text><line x1="373" y1="291" x2="1144" y2="291" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="1153" y="275" width="26" height="32" rx="5" fill="#e5edf8" stroke="#c7d2e1" stroke-width="1.5"/><rect x="32" y="337" width="705" height="48" rx="12" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><text x="46" y="367" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#203044" text-anchor="start">Entry 2: A + B; two projected contributions</text><line x1="749" y1="361" x2="1144" y2="361" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="1153" y="345" width="26" height="32" rx="5" fill="#eaf5f0" stroke="#c7d2e1" stroke-width="1.5"/><rect x="408" y="407" width="705" height="48" rx="12" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><text x="422" y="437" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#203044" text-anchor="start">Entry 3: B + C; overlap reuses B positions</text><line x1="1125" y1="431" x2="1144" y2="431" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="1153" y="415" width="26" height="32" rx="5" fill="#f1edfa" stroke="#c7d2e1" stroke-width="1.5"/><rect x="32" y="508" width="1138" height="84" rx="12" fill="#fbf1e5" stroke="#c7d2e1" stroke-width="1.5"/><text x="51" y="540" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">An unfinished block cannot become a causally available compressed record yet.</text><text x="51" y="570" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203044" text-anchor="start">Keep compression state and recent uncompressed entries; boundaries add memory beyond pooled-record counts.</text></svg>
