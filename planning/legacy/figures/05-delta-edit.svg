<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" width="1120" height="530" role="img" aria-labelledby="title desc"><title id="title">Read the association, then write its correction</title><desc id="desc">Four steps read the stored value 2, compare it to new value 5, write residual 3 with beta one, and obtain state [5 4], preserving an unrelated orthogonal association.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203044"/></marker></defs><rect width="1120" height="530" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="32" y="48" font-size="28" text-anchor="start" font-weight="600" fill="#203044">Read the association, then write its correction</text><text x="32" y="87" font-size="18" text-anchor="start" font-weight="400" fill="#5c6b7d">Toy delivery code: Tuesday = 2; Friday = 5. Keys are orthogonal.</text><rect x="24" y="133" width="248" height="227" rx="14" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><text x="42" y="172" font-size="23" text-anchor="start" font-weight="600" fill="#203044">1 · Read</text><text x="42" y="218" font-size="18" text-anchor="start" font-weight="400" fill="#203044">S = [2   4]</text><text x="42" y="260" font-size="18" text-anchor="start" font-weight="400" fill="#203044">k = [1   0]ᵀ</text><text x="42" y="302" font-size="18" text-anchor="start" font-weight="400" fill="#203044">Old prediction = 2</text><path d="M 274 254 L 296 254" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="298" y="133" width="248" height="227" rx="14" fill="#f1edfa" stroke="#d7dee8" stroke-width="1.5"/><text x="316" y="172" font-size="23" text-anchor="start" font-weight="600" fill="#203044">2 · Compare</text><text x="316" y="218" font-size="18" text-anchor="start" font-weight="400" fill="#203044">Incoming value = 5</text><text x="316" y="260" font-size="18" text-anchor="start" font-weight="400" fill="#203044">Prediction = 2</text><text x="316" y="302" font-size="18" text-anchor="start" font-weight="400" fill="#203044">Residual = 5 − 2 = 3</text><path d="M 548 254 L 570 254" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="572" y="133" width="248" height="227" rx="14" fill="#fbf1e5" stroke="#d7dee8" stroke-width="1.5"/><text x="590" y="172" font-size="23" text-anchor="start" font-weight="600" fill="#203044">3 · Write</text><text x="590" y="218" font-size="18" text-anchor="start" font-weight="400" fill="#203044">β = 1</text><text x="590" y="260" font-size="18" text-anchor="start" font-weight="400" fill="#203044">ΔS = [3   0]</text><text x="590" y="302" font-size="18" text-anchor="start" font-weight="400" fill="#203044">Write along this key</text><path d="M 822 254 L 844 254" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="846" y="133" width="248" height="227" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="864" y="172" font-size="23" text-anchor="start" font-weight="600" fill="#203044">4 · Keep</text><text x="864" y="218" font-size="18" text-anchor="start" font-weight="400" fill="#203044">New S = [5   4]</text><text x="864" y="260" font-size="18" text-anchor="start" font-weight="400" fill="#203044">7314 now reads 5</text><text x="864" y="302" font-size="18" text-anchor="start" font-weight="400" fill="#203044">Other order still reads 4</text><rect x="32" y="410" width="1056" height="78" rx="14" fill="#f8fafc" stroke="#d7dee8" stroke-width="1.5"/><text x="54" y="441" font-size="19" text-anchor="start" font-weight="400" fill="#203044">An additive write gives [7   4]. A residual edit gives [5   4].</text><text x="54" y="470" font-size="19" text-anchor="start" font-weight="400" fill="#203044">Exact preservation here relies on the artificial keys being orthogonal.</text></g></svg>