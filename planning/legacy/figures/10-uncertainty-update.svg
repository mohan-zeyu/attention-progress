<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-labelledby="title desc"><title id="title">A memory update can use tracked uncertainty</title><desc id="desc">Predicted memory yields a residual, while predicted association uncertainty and observation noise determine the gain. These update both the memory estimate and its uncertainty.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203044"/></marker></defs><rect width="1120" height="640" fill="white"/><g font-family="Inter, Arial, sans-serif"><text x="32" y="48" font-size="28" text-anchor="start" font-weight="600" fill="#203044">A memory update can use tracked uncertainty</text><rect x="34" y="108" width="440" height="124" rx="14" fill="#e5edf8" stroke="#d7dee8" stroke-width="1.5"/><text x="58" y="148" font-size="23" text-anchor="start" font-weight="500" fill="#203044">Predicted memory S⁻</text><text x="58" y="192" font-size="23" text-anchor="start" font-weight="500" fill="#203044">Predicted uncertainty P⁻</text><rect x="645" y="108" width="440" height="124" rx="14" fill="#fbf1e5" stroke="#d7dee8" stroke-width="1.5"/><text x="669" y="148" font-size="23" text-anchor="start" font-weight="500" fill="#203044">Incoming observation v</text><text x="669" y="192" font-size="23" text-anchor="start" font-weight="500" fill="#203044">Observation noise r</text><path d="M 254 233 L 254 284" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><path d="M 865 233 L 865 284" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="287" width="440" height="110" rx="14" fill="#f1edfa" stroke="#d7dee8" stroke-width="1.5"/><text x="58" y="329" font-size="21" text-anchor="start" font-weight="400" fill="#203044">Residual: v − S⁻k</text><text x="58" y="367" font-size="21" text-anchor="start" font-weight="400" fill="#203044">What differs from the prediction?</text><rect x="645" y="287" width="440" height="110" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="669" y="329" font-size="20" text-anchor="start" font-weight="400" fill="#203044">Gain from P⁻, k, and r</text><text x="669" y="367" font-size="20" text-anchor="start" font-weight="400" fill="#203044">How much should the update influence S?</text><path d="M 254 398 L 254 451" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><path d="M 865 398 L 865 451" fill="none" stroke="#203044" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="454" width="1051" height="101" rx="14" fill="#eaf5f0" stroke="#d7dee8" stroke-width="1.5"/><text x="58" y="493" font-size="23" text-anchor="start" font-weight="400" fill="#203044">Update the memory estimate and its uncertainty</text><text x="58" y="530" font-size="23" text-anchor="start" font-weight="400" fill="#203044">S_new = S⁻ + residual × gainᵀ</text><text x="34" y="602" font-size="18" text-anchor="start" font-weight="400" fill="#5c6b7d">Association uncertainty is an internal memory variable, not calibrated answer confidence.</text></g></svg>