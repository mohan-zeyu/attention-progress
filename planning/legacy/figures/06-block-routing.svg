<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 645" role="img" aria-labelledby="title desc"><title id="title">MoBA: route by summaries, read full records</title><desc id="desc">All original blocks remain stored. Query to mean-key block affinities selects historical blocks; attention reads their full entries and includes the causal current block.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#203044"/></marker></defs><rect width="1200" height="645" fill="#fff"/><text x="30" y="43" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#203044" text-anchor="start">MoBA: summaries choose blocks; full records supply the read</text><text x="30" y="75" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#66758b" text-anchor="start">Illustrative routing for order 7314. The selection shown is a useful outcome, not a measured result.</text><rect x="28" y="107" width="348" height="379" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="46" y="139" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">1 · Keep historical blocks</text><rect x="429" y="107" width="313" height="379" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="447" y="139" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">2 · Rank mean-key matches</text><rect x="797" y="107" width="374" height="379" rx="12" fill="#fff" stroke="#c7d2e1" stroke-width="1.5"/><text x="815" y="139" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#203044" text-anchor="start">3 · Read the selected entries</text><rect x="45" y="159" width="314" height="48" rx="12" fill="#e5edf8" stroke="#c7d2e1" stroke-width="1.5"/><text x="59" y="188" font-family="Arial, Helvetica, 