<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">kern-sage</title><desc id="desc">Low-bit attention kernels. Bits per operand of the two matmuls: FA-2 16/16; FA-3 FP8 8/8; SageAttention 1 INT8 QK with FP16 PV; SageAttention 2 INT4 QK with FP8 PV; SageAttention 3 FP4 for both (NVFP4, 1×16 blocks). Smoothing K by subtracting its mean over tokens leaves softmax unchanged and shrinks the INT8 step for a toy channel 9.8, 10.2, 10.3, 9.7 from 0.081 to 0.0024, 34× finer. Reported kernel speedups over FlashAttention-2 on consumer GPUs: about 2.1×, 3× and 5×.</desc>
