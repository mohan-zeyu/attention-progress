<title id="title">choose-kv-bytes</title><desc id="desc">Growing KV bytes per token, all layers, for 17 frontier designs on a log scale, from 516,096 B (Llama 3.1-405B, all GQA) down to 6,144 B (Nemotron 3 Nano) and a reported 890 B (DeepSeek-V4.1-Flash, FP4). Right column: the same cache at one million tokens.</desc>
