<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" role="img" aria-labelledby="title desc">
<title id="title">delta-sum-form</title><desc id="desc">Product form versus sum form on the toy with α = 0.8 and β = 0.5. Product (Gated DeltaNet, KDA): decay first, the erase reads the faded 1.6 and removes 0.8, result [3.3, 3.2]. Sum (RWKV-7, Comba): decay and erase act in parallel, the erase reads the unfaded 2 and removes 1.0, result [3.1, 3.2]. RWKV-7 uses vector decay w_t in (0.545, 1) and a vector in-context learning rate a_t in (0, 1) per channel, with head size 64 (4,096 state numbers per head).</desc>
<defs>
