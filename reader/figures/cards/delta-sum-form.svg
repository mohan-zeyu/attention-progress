<text x="30" y="381.55" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#253340">0.1B–2.9B models trained on 1.6T–5.6T tokens</text>
<text x="500" y="340" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#687986">With w = 0.8, a = 0.5 on every channel</text>
<text x="500" y="360" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#687986">(and k̃ = a ⊙ k), RWKV-7 gives [3.1, 3.2] too.</text>
<text x="450" y="426" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#253340">Product: the erase sees what decay left. Sum: decay and erase both act on the old state, then add.</text>
