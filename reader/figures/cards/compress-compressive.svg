<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">compress-compressive</title><desc id="desc">Compressive Transformer. Toy: memories that leave the FIFO are pooled 3 to 1 into a compressed memory instead of being dropped. Real Enwik8 setting: a Transformer-XL with 2,304 memory slots reaches 2,304 past tokens per layer; the Compressive Transformer attends to fewer slots (768 memory + 1,152 compressed) yet reaches 4,224 past tokens per layer at rate c = 3.</desc>
