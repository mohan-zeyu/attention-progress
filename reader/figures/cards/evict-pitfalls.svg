<title id="title">evict-pitfalls</title><desc id="desc">Toy 30-token conversation, three budgets. Selection stores all 30 records, so question 2 still reads its evidence. Eviction chosen while answering question 1 stores 13 and has already dropped question 2&#x27;s evidence and a system-prompt rule; the evicted set only grows. Compression (next chapter) stores 8 merged records: the evidence survives only inside a pooled record.</desc>
