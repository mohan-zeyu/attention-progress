<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">hybrid-why</title><desc id="desc">Per-sequence memory in elements against context length for the Qwen3-Next-80B-A3B stack (36 Gated DeltaNet + 12 gated attention layers): the fixed state is 18.9M elements and the 12 attention layers add 12,288 elements per token, so KV overtakes the state at N = 1,536. The same 48 layers as all attention would need 49,152 per token, as all GDN a flat 25.2M. Right: the whole recurrent state equals the KV of N* tokens: Jamba 448, Qwen3-Next 1,536, Kimi Linear 2,601, Qwen3.5 3,072, MiniMax-01 3,584, Nemotron 3 Nano 3,925, Granite 4.0-H 4,608, Kimi K3 7,851, Nemotron-H-56B 11,059.</desc>
