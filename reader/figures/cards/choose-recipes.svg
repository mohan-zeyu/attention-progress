<rect width="900" height="400" fill="white"/>
<text x="450" y="30" text-anchor="middle" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="18" fill="#253340"><tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">a 2026 stack</tspan> = <tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">positions</tspan> + <tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">stability</tspan> + <tspan fill="#3f83b6"><tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">thin records</tspan></tspan> + <tspan fill="#1f9a74"><tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">fewer reads</tspan></tspan> + <tspan fill="#8d6bb5"><tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">state</tspan></tspan> + <tspan fill="#687986"><tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">bytes</tspan></tspan></text>
