<rect x="200" y="376" width="420.0" height="18" rx="4" fill="#687986" fill-opacity="0.85"/>
<text x="628.0" y="388.24" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#687986">295 FLOP/B</text>
<text x="450" y="424" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#253340">Even G = 8 is ~37× below the ridge: decode attention stays bandwidth-bound, so bytes moved ≈ time.</text>
