<line x1="350" y1="243" x2="390" y2="243" stroke="#687986" stroke-width="1.4"/>
<path d="M370 243L370 283L390 283" fill="none" stroke="#687986" stroke-width="1.4"/>
<text x="480" y="288" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#687986">LRU leaf: evicted first</text>
<text x="680" y="120" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f9a74">hit 1,350 of 1,410 tokens</text>
<text x="680" y="140" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#d09124">prefill only 60 (4%)</text>
<text x="30" y="318" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#687986">toy token counts · page = 1 token · scheduler serves longest shared prefix first (= DFS order)</text>
<line x1="20" y1="334" x2="880" y2="334" stroke="#cad5db" stroke-width="1.2"/>
<text x="30" y="358" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">Prefix-cache hit rates, reported</text>
<text x="220" y="383" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#253340">SGLang benchmarks</text>
<rect x="230" y="370" width="150" height="15" rx="2" fill="#1f9a74" fill-opacity="0.85"/>
