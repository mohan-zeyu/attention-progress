<line x1="350" y1="123" x2="390" y2="123" stroke="#1f9a74" stroke-width="2"/>
<rect x="550" y="108" width="110" height="30" rx="6" fill="#f4f7f8" fill-opacity="0.85" stroke="#d09124" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="605.0" y="127.68" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#d09124">new · 60</text>
<line x1="510" y1="123" x2="550" y2="123" stroke="#d09124" stroke-width="2" stroke-dasharray="5 4"/>
