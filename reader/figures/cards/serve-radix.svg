<text x="220" y="440" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#253340">DeepSeek API, on disk</text>
<rect x="230" y="427" width="168.89999999999998" height="15" rx="2" fill="#3f83b6" fill-opacity="0.85"/>
<text x="406.9" y="440" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#3f83b6">56.3% of 608B tok/day</text>
<text x="870" y="380" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f9a74">SGLang: up to 6.4× throughput</text>
<text x="870" y="402" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#687986">hit needs a byte-identical prefix:</text>
<text x="870" y="420" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#cf5f59">context truncation can halve it (LMCache)</text>
</svg>
