<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">delta-eigen</title><desc id="desc">The delta transition I − βkkᵀ has eigenvalues 1 (d_k − 1 times) and 1 − β. With β in [0, 1] they stay in [0, 1]; allowing β up to 2 reaches −1, a reflection. Parity toy: with β = 2 for every 1-bit, the 1-D state flips sign and after bits 1 0 1 1 0 1 ends at +1 (even); with β ≤ 1 the sign can never flip. Two reflections with mirrors 30° apart make a 60° rotation, as in DeltaProduct with n_h = 2. Olmo Hybrid 7B ships linear_allow_neg_eigval = true.</desc>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#253340"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#687986"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3f83b6"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f9a74"/></marker>
<marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d09124"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#cf5f59"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8d6bb5"/></marker>
<marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2a9aa6"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#cad5db"/></marker>
</defs>
<rect width="900" height="470" fill="white"/>
<text x="30" y="36" text-anchor="start" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="21" fill="#253340"><tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">eig</tspan>(<tspan font-style="italic">I</tspan> - <tspan fill="#2a9aa6">β</tspan><tspan fill="#3f83b6"><tspan font-style="italic">kk</tspan></tspan><tspan dy="-8.8" font-size="14.3"><tspan font-style="normal">⊤</tspan></tspan><tspan dy="8.8" font-size="21.0"> </tspan>) = {1, <tspan font-style="normal">…</tspan>, 1,   1 - <tspan fill="#2a9aa6">β</tspan>}, <tspan font-style="normal"> </tspan> <tspan fill="#2a9aa6">β</tspan> <tspan font-style="normal">∈</tspan> (0, 2) ⇒ 1 - <tspan fill="#2a9aa6">β</tspan> <tspan font-style="normal">∈</tspan> (-1, 1)</text>
<text x="30" y="82" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#253340">Where the eigenvalue 1 − β can sit</text>
