<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" role="img" aria-labelledby="title desc">
<title id="title">delta-deltanet</title><desc id="desc">Toy delta update for order 7314 with d_v = 1, d_k = 2, k_t = e₁ and v_t = 5 (Friday). The state [2, 4] predicts 2 (Tuesday) at k_t; the residual is 5 − 2 = 3; with β = 1 the write [3, 0] gives [5, 4], so 7314 now reads Friday and order 2208 keeps 4. Additive linear attention would give [7, 4]. β = 0, 0.5, 1 give 2, 3.5, 5. A query halfway between both keys moves from 4.24 to 6.36.</desc>
