<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">map-timeline</title><desc id="desc">Timeline 2014–2026 in five lanes: KV width (MHA, MQA, GQA, MLA, K=V), positions and stability (RoPE, YaRN, soft-capping, sink logits, output gates), sparse/evict/compress (Sparse Transformer to DSA and CSA/HCA), recurrent state (linear attention to KDA, GDN-2, Mamba-3), and hybrids/systems (FlashAttention, PagedAttention, MiniMax-01, Qwen3-Next, Kimi Linear, DeepSeek-V4). Years before 2023 are compressed.</desc>
