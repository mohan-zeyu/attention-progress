<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">kv-tie</title><desc id="desc">K=V tying: one projection u = W_K h serves as key (normed, 25% of dims rotated) and as value (normed, never rotated). Gemma 4 31B global layer: 4 KV heads × 512 store 4,096 elements with separate K and V; the report gives 37.5% less global KV. DeepSeek-V4: one 512-element entry is both key and value (1,024 → 512 elements). Kayyam et al.: K=V cuts KV to 50% of MHA at +3.1% perplexity; with GQA-4 to 12.5%, with MQA to 3.1%.</desc>
