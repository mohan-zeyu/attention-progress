<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">hybrid-seq-par</title><desc id="desc">Sequential versus parallel hybrids. Sequential (Jamba, Nemotron-H, Samba): whole layers alternate, and only the attention layers keep a KV cache. Parallel (Hymba, Falcon-H1): every layer runs attention heads and SSM heads side by side; Falcon-H1 splits channels SSM 2 : attention 1 : MLP 5. Computed KV per token in BF16: Falcon-H1-34B 144 KiB (72 layers, 4 KV heads), Nemotron-H-56B 40 KiB (10 layers, 8 KV heads). Reported for Hymba-1.5B at 8K: 78.6 MB cache and 664 tok/s, 11.67 times smaller and 3.49 times faster than Llama-3.2-3B.</desc>
