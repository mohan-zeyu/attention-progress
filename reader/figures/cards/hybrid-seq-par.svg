<text x="24" y="384" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#253340">Parallel ≠ fewer KV layers: Falcon-H1 keeps KV in all 72 layers and saves through few KV heads.</text>
<text x="24" y="406" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#253340">Sequential hybrids put KV in few layers. Hymba gets both: parallel heads + SWA + cross-layer KV sharing.</text>
<text x="24" y="430" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#687986">Samba (Microsoft): Mamba-MLP-SWA(2048)-MLP repeated, no global layer at all.</text>
