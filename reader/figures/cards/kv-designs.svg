<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" role="img" aria-labelledby="title desc">
<title id="title">kv-designs</title><desc id="desc">Decode arithmetic intensity (FLOPs per KV byte, BF16) against cached elements per token per layer: MHA Llama-2-7B 8,192 elements, 1 FLOP/B; GQA Llama-3-70B 2,048, 8; GTA-8 toy 1,088, about 15; MFA Step-3 512, 64; GLA-2 toy 576, 128; MLA DeepSeek-V3 576, 242; K=V MQA DeepSeek-V4-Pro 512, 256. Ridge points: A800 156, H100 295.</desc>
