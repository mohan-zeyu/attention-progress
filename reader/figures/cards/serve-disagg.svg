<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" role="img" aria-labelledby="title desc">
<title id="title">serve-disagg</title><desc id="desc">Prefill/decode disaggregation. On one GPU a new long prefill stalls every running decode; split pools let prefill GPUs run prompts and ship the KV to decode GPUs. Computed transfer for a 32K-token prompt: DeepSeek-V3.2 FP8 (61 × 656 B = 40,016 B per token) is 1.22 GiB, 26 ms over one 400 Gb/s NIC or 6.9 ms at Mooncake’s reported 190 GB/s; Llama-3-70B BF16 (320 KiB per token) is 10 GiB, 215 ms over one NIC. Reported: DistServe 7.4× more requests, Splitwise 1.4× throughput at 20% lower cost, Mooncake 59–498% more capacity; DeepSeek uses 4 prefill nodes against 18 decode nodes per unit.</desc>
