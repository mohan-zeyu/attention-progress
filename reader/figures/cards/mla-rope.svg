<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" role="img" aria-labelledby="title desc">
<title id="title">mla-rope</title><desc id="desc">Why RoPE breaks absorption and how MLA fixes it. With RoPE on the content key, the score is q^T R_(j-t) W_UK c_j: the rotation depends on the key position j and sits between the query and W_UK, so W_UK cannot be folded into the query once. MLA adds a separate 64-dimensional lane: per-head rotated queries q^R and one rotated key k^R shared by all 128 heads. Score = absorbed content term over 512 dims + positional term over 64 dims, scaled by 1/sqrt(192). Shared k^R costs 64 elements per token; per-head rotated keys would cost 8,192.</desc>
