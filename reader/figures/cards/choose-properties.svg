<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">choose-properties</title><desc id="desc">What each lever guarantees by construction. Full attention: exact recall, nothing discarded, cost grows. Windows alone: flat cost, no recall beyond W. Sparse reads: cache intact, recall only if the selector finds it. Eviction: flat cost, irreversible. Compression: blurred detail, still N/r growth. Recurrent state: flat cost, recall limited by capacity. Hybrids: exact recall through a few full layers.</desc>
