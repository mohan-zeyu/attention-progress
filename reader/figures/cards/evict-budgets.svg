<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">evict-budgets</title><desc id="desc">Same scorer, different budget split. PyramidKV gives Llama-3-8B layers a linear budget from 250 entries per head at layer 0 to 6.4 at layer 31 (mean 128, beta 20). Ada-KV pools one layer&#x27;s budget across heads: a toy layer budget of 12 over 4 heads becomes 6, 3, 2 and 1.</desc>
