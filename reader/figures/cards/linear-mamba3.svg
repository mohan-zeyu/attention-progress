<text x="450" y="392" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#253340">Same state bytes as Mamba-2; reported: MIMO with N = 64 matches Mamba-2 perplexity at N = 128.</text>
