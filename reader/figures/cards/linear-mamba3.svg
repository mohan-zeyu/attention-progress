<text x="870" y="36" text-anchor="end" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="18" fill="#253340"><tspan fill="#2a9aa6">β<tspan dy="5.0" font-size="12.2"><tspan font-style="italic">t</tspan></tspan><tspan dy="-5.0" font-size="18.0"> </tspan></tspan> = (1-λ<tspan dy="5.0" font-size="12.2"><tspan font-style="italic">t</tspan></tspan><tspan dy="-5.0" font-size="18.0"> </tspan>)Δ<tspan dy="5.0" font-size="12.2"><tspan font-style="italic">t</tspan></tspan><tspan dy="-5.0" font-size="18.0"> </tspan><tspan fill="#2a9aa6">α<tspan dy="5.0" font-size="12.2"><tspan font-style="italic">t</tspan></tspan><tspan dy="-5.0" font-size="18.0"> </tspan></tspan>,   <tspan fill="#2a9aa6">γ<tspan dy="5.0" font-size="12.2"><tspan font-style="italic">t</tspan></tspan><tspan dy="-5.0" font-size="18.0"> </tspan></tspan> = λ<tspan dy="5.0" font-size="12.2"><tspan font-style="italic">t</tspan></tspan><tspan dy="-5.0" font-size="18.0"> </tspan>Δ<tspan dy="5.0" font-size="12.2"><tspan font-style="italic">t</tspan></tspan><tspan dy="-5.0" font-size="18.0"> </tspan></text>
