<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">linear-mamba3</title><desc id="desc">Mamba-3 changes three things. (a) Trapezoid write: with toy Δ = 0.5, α = 0.8, Mamba-2 (λ = 1) writes 0.5 of x_t only, the trapezoid rule (λ = ½) writes 0.2 of x_(t−1) and 0.25 of x_t. (b) A complex state turns the decay into a rotation: eigenvalues move from the real point α to α·e^(±iθ), equivalent to data-dependent RoPE on B and C. (c) MIMO: rank-R writes (P×R)(R×N) with R = 4 do about 4× the decode FLOPs on the same 64×128 state.</desc>
