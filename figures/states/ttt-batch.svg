<title id="title">ttt-batch</title><desc id="desc">Mini-batch TTT on 32 toy tokens. With b = 1 every gradient uses the latest weights: 32 sequential steps. With b = 8 the gradients in a batch share the batch-start weights: 4 steps, each one matrix product. With b = T there is one step, which equals linear attention.</desc>
