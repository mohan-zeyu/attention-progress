<title id="title">gla-channels</title><desc id="desc">A toy 4×6 state multiplied by Diag(alpha) with alpha = 1, 0.95, 0.5, 0.9, 0.1, 0.99: each key-channel column fades at its own rate and channel 5 is nearly wiped. A scalar decay multiplies every column by the same 0.8.</desc>
