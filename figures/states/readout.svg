<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" role="img" aria-labelledby="title desc">
<title id="title">readout</title><desc id="desc">Key similarity k_i·k_j for unit keys. With 4 orthogonal keys in 4 dimensions only the diagonal is non-zero, so reading with key i returns exactly v_i. With 8 keys in 4 dimensions the off-diagonal entries are non-zero, so every read mixes in other values (crosstalk).</desc>
