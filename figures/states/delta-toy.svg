<text x="375.0" y="150" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">5</text>
<rect x="440" y="132" width="90" height="26" rx="4" fill="#1f9a74" fill-opacity="0.3" stroke="#1f9a74" stroke-width="1"/>
<text x="485.0" y="150" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">4</text>
<text x="310" y="186" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#253340">gated delta, α = 0.8, β = 0.5</text>
<rect x="330" y="168" width="90" height="26" rx="4" fill="#d09124" fill-opacity="0.3" stroke="#d09124" stroke-width="1"/>
<text x="375.0" y="186" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">3.3</text>
<rect x="440" y="168" width="90" height="26" rx="4" fill="#cf5f59" fill-opacity="0.3" stroke="#cf5f59" stroke-width="1"/>
<text x="485.0" y="186" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">3.2</text>
<text x="310" y="222" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#253340">KDA, α = (0.8, 1), β = 0.5</text>
<rect x="330" y="204" width="90" height="26" rx="4" fill="#d09124" fill-opacity="0.3" stroke="#d09124" stroke-width="1"/>
<text x="375.0" y="222" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">3.3</text>
<rect x="440" y="204" width="90" height="26" rx="4" fill="#1f9a74" fill-opacity="0.3" stroke="#1f9a74" stroke-width="1"/>
<text x="485.0" y="222" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">4</text>
<text x="310" y="258" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#253340">sum form, α = 0.8, β = 0.5</text>
<rect x="330" y="240" width="90" height="26" rx="4" fill="#d09124" fill-opacity="0.3" stroke="#d09124" stroke-width="1"/>
<text x="375.0" y="258" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">3.1</text>
<rect x="440" y="240" width="90" height="26" rx="4" fill="#cf5f59" fill-opacity="0.3" stroke="#cf5f59" stroke-width="1"/>
<text x="485.0" y="258" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">3.2</text>
<rect x="40" y="274" width="12" height="12" rx="2" fill="#1f9a74" fill-opacity="0.3" stroke="#1f9a74" stroke-width="1"/>
<text x="58" y="285" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#253340">right</text>
<rect x="150" y="274" width="12" height="12" rx="2" fill="#d09124" fill-opacity="0.3" stroke="#d09124" stroke-width="1"/>
<text x="168" y="285" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#253340">partly fixed</text>
<rect x="260" y="274" width="12" height="12" rx="2" fill="#cf5f59" fill-opacity="0.3" stroke="#cf5f59" stroke-width="1"/>
<text x="278" y="285" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#253340">wrong or damaged</text>
