<rect x="440" y="60" width="90" height="26" rx="4" fill="#cad5db" fill-opacity="0.25" stroke="#cad5db" stroke-width="1"/>
<text x="485.0" y="78" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">4</text>
<text x="310" y="114" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#253340">add</text>
