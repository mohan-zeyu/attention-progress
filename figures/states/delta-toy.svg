<text x="375.0" y="114" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">7</text>
<rect x="440" y="96" width="90" height="26" rx="4" fill="#1f9a74" fill-opacity="0.3" stroke="#1f9a74" stroke-width="1"/>
<text x="485.0" y="114" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">4</text>
<text x="310" y="150" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#253340">delta, β = 1</text>
