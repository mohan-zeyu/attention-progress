<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">serve-paged</title><desc id="desc">PagedAttention stores each request’s KV in fixed blocks addressed through a block table, like virtual memory. Toy with block size 4: request A uses physical blocks 7, 1, 3 and request B blocks 5, 2; only the last block of each request has empty slots. Reported KV memory breakdown: Orca (Max) 20.4% token states, 13.3% reservation, 57.3% internal and 8.9% external fragmentation; Orca (Pow2) 26.8%, 17.9%, 13.6%, 41.6%; vLLM 96.3% token states. OPT-13B needs 800 KB per token, so reserving 2,048 tokens costs 1.6 GB per request, while paging wastes at most 15 tokens, 12 MB, with block 16.</desc>
