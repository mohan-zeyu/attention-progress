<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">stable-anatomy</title><desc id="desc">A 2026 attention block as eight stages, with what four released models put at each stage, from configs and code. gpt-oss-120b: 8 KV heads of 64, full RoPE base 150K with YaRN x32, 128-token window alternating 1:1 with full layers, learned sink per head. Gemma 4 31B: K=V on global layers (4 x 512), q and k RMS-norm with scale 1.0, p-RoPE 1/4 at base 1M on global layers and 10K on local, window 1,024 at 5:1, V-norm. DeepSeek-V4-Pro: K=V single 512-d MQA entry, q RMS and kv-norm, last 64 of 512 dims rotated, window 128 plus compressed entries, sink per head, output de-rotation, 16-group low-rank output projection. Qwen3-Next-80B: 2 KV heads of 256, per-head q and k RMS-norm, 1/4 of 256 dims rotated at base 10M, full attention in 1 of 4 layers, elementwise sigmoid output gate.</desc>
