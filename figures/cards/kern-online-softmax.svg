<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" role="img" aria-labelledby="title desc">
<title id="title">kern-online-softmax</title><desc id="desc">Toy worked example of the online softmax: one query row with scores 1, 3 | 2, 5 and scalar values 4, 2 | 6, 1 in two tiles. After tile 1: m = 3, ℓ = 1.135, unnormalised output 2.541. Tile 2 alone: m = 5, ℓ = 1.050, 1.299. Merging rescales the old statistics by e^(3−5) = 0.135, giving ℓ = 1.203, Õ = 1.643, o = 1.365, identical to a full softmax.</desc>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#253340"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#687986"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3f83b6"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f9a74"/></marker>
<marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d09124"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#cf5f59"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8d6bb5"/></marker>
<marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2a9aa6"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#cad5db"/></marker>
</defs>
<rect width="900" height="372" fill="white"/>
<text x="30" y="36" text-anchor="start" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="21" fill="#253340"><tspan font-style="italic">m</tspan>′ = <tspan font-style="normal">max</tspan>(<tspan font-style="italic">m</tspan>, <tspan fill="#3f83b6"><tspan font-style="italic">m</tspan><tspan dy="5.9" font-size="14.3"><tspan font-style="italic">j</tspan></tspan><tspan dy="-5.9" font-size="21.0"> </tspan></tspan>)</text>
<text x="250" y="36" text-anchor="start" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="21" fill="#253340"><tspan font-style="italic">ℓ</tspan>′ = <tspan fill="#cf5f59"><tspan font-style="italic">e</tspan><tspan dy="-8.8" font-size="14.3"><tspan font-style="italic">m</tspan>−<tspan font-style="italic">m</tspan>′</tspan><tspan dy="8.8" font-size="21.0"> </tspan></tspan><tspan font-style="italic">ℓ</tspan> + <tspan font-style="italic">e</tspan><tspan dy="-8.8" font-size="14.3"><tspan fill="#3f83b6"><tspan font-style="italic">m</tspan><tspan dy="4.0" font-size="9.7"><tspan font-style="italic">j</tspan></tspan><tspan dy="-4.0" font-size="14.3"> </tspan></tspan>−<tspan font-style="italic">m</tspan>′</tspan><tspan dy="8.8" font-size="21.0"> </tspan><tspan fill="#3f83b6"><tspan font-style="italic">ℓ</tspan><tspan dy="5.9" font-size="14.3"><tspan font-style="italic">j</tspan></tspan><tspan dy="-5.9" font-size="21.0"> </tspan></tspan></text>
<text x="560" y="36" text-anchor="start" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="21" fill="#253340">Õ′ = <tspan fill="#cf5f59"><tspan font-style="italic">e</tspan><tspan dy="-8.8" font-size="14.3"><tspan font-style="italic">m</tspan>−<tspan font-style="italic">m</tspan>′</tspan><tspan dy="8.8" font-size="21.0"> </tspan></tspan>Õ + <tspan font-style="normal">Σ</tspan><tspan dy="5.9" font-size="14.3"><tspan font-style="italic">j</tspan></tspan><tspan dy="-5.9" font-size="21.0"> </tspan> <tspan font-style="italic">e</tspan><tspan dy="-8.8" font-size="14.3"><tspan font-style="italic">s</tspan><tspan dy="4.0" font-size="9.7"><tspan font-style="italic">j</tspan></tspan><tspan dy="-4.0" font-size="14.3"> </tspan>−<tspan font-style="italic">m</tspan>′</tspan><tspan dy="8.8" font-size="21.0"> </tspan> <tspan fill="#8d6bb5"><tspan font-style="italic">v</tspan><tspan dy="5.9" font-size="14.3"><tspan font-style="italic">j</tspan></tspan><tspan dy="-5.9" font-size="21.0"> </tspan></tspan></text>
<text x="30" y="72" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#687986">toy · one query row, 4 keys, 2 tiles</text>
<rect x="40" y="104" width="50" height="34" rx="4" fill="#3f83b6" fill-opacity="0.35"/>
<text x="65" y="127" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">s = 1</text>
<rect x="40" y="142" width="50" height="28" rx="4" fill="#8d6bb5" fill-opacity="0.2"/>
<text x="65" y="161" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8d6bb5">v = 4</text>
<rect x="98" y="104" width="50" height="34" rx="4" fill="#3f83b6" fill-opacity="0.35"/>
<text x="123" y="127" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">s = 3</text>
<rect x="98" y="142" width="50" height="28" rx="4" fill="#8d6bb5" fill-opacity="0.2"/>
<text x="123" y="161" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8d6bb5">v = 2</text>
<rect x="170" y="104" width="50" height="34" rx="4" fill="#3f83b6" fill-opacity="0.75"/>
<text x="195" y="127" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">s = 2</text>
<rect x="170" y="142" width="50" height="28" rx="4" fill="#8d6bb5" fill-opacity="0.2"/>
<text x="195" y="161" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8d6bb5">v = 6</text>
<rect x="228" y="104" width="50" height="34" rx="4" fill="#3f83b6" fill-opacity="0.75"/>
<text x="253" y="127" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">s = 5</text>
<rect x="228" y="142" width="50" height="28" rx="4" fill="#8d6bb5" fill-opacity="0.2"/>
<text x="253" y="161" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8d6bb5">v = 1</text>
<path d="M40 105L40 100L148 100L148 105" fill="none" stroke="#3f83b6" stroke-width="1.2"/>
<text x="94.0" y="94" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#3f83b6">tile 1</text>
<path d="M170 171L170 176L278 176L278 171" fill="none" stroke="#3f83b6" stroke-width="1.2"/>
<text x="224.0" y="191" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#3f83b6">tile 2</text>
<text x="520" y="80" text-anchor="middle" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="17" fill="#253340"><tspan font-style="italic">m</tspan></text>
<text x="642" y="80" text-anchor="middle" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="17" fill="#253340"><tspan font-style="italic">ℓ</tspan></text>
<text x="792" y="80" text-anchor="middle" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="17" fill="#253340">Õ</text>
<text x="316" y="110" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#253340">after tile 1</text>
<text x="520" y="110" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#253340">3</text>
<text x="642" y="110" text-anchor="middle" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="15" fill="#253340"><tspan font-style="italic">e</tspan><tspan dy="-6.3" font-size="10.2">−2</tspan><tspan dy="6.3" font-size="15.0"> </tspan> + 1 = 1.135</text>
<text x="792" y="110" text-anchor="middle" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="15" fill="#253340">4<tspan font-style="italic">e</tspan><tspan dy="-6.3" font-size="10.2">−2</tspan><tspan dy="6.3" font-size="15.0"> </tspan> + 2 = 2.541</text>
<text x="316" y="140" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#3f83b6">tile 2 alone</text>
<text x="520" y="140" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3f83b6">5</text>
<text x="642" y="140" text-anchor="middle" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="15" fill="#3f83b6"><tspan font-style="italic">e</tspan><tspan dy="-6.3" font-size="10.2">−3</tspan><tspan dy="6.3" font-size="15.0"> </tspan> + 1 = 1.050</text>
<text x="792" y="140" text-anchor="middle" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="15" fill="#3f83b6">6<tspan font-style="italic">e</tspan><tspan dy="-6.3" font-size="10.2">−3</tspan><tspan dy="6.3" font-size="15.0"> </tspan> + 1 = 1.299</text>
<rect x="308" y="158" width="562" height="30" rx="4" fill="#cf5f59" fill-opacity="0.08"/>
<text x="316" y="178" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cf5f59">rescale the old (m, ℓ, Õ) by</text>
<text x="662" y="178" text-anchor="middle" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="16" fill="#cf5f59" font-weight="700"><tspan font-style="italic">e</tspan><tspan dy="-6.7" font-size="10.9">3−5</tspan><tspan dy="6.7" font-size="16.0"> </tspan> = 0.135</text>
<text x="316" y="212" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#253340">merged</text>
<text x="520" y="212" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#253340">5</text>
<text x="642" y="212" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#253340">0.135·1.135 + 1.050</text>
<text x="792" y="212" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#253340">0.135·2.541 + 1.299</text>
<text x="642" y="233" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#253340">= 1.203</text>
<text x="792" y="233" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#253340">= 1.643</text>
<line x1="20" y1="262" x2="880" y2="262" stroke="#cad5db" stroke-width="1.2"/>
<text x="30" y="302" text-anchor="start" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="22" fill="#253340"><tspan fill="#1f9a74"><tspan font-style="italic">o</tspan></tspan> = Õ / <tspan font-style="italic">ℓ</tspan> = 1.643 / 1.203 = <tspan fill="#1f9a74">1.365</tspan></text>
<text x="450" y="296" text-anchor="start" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="15" fill="#687986"><tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">check, full softmax: </tspan> <tspan font-style="normal">Σ</tspan> <tspan font-style="italic">e</tspan><tspan dy="-6.3" font-size="10.2"><tspan font-style="italic">s</tspan>−5</tspan><tspan dy="6.3" font-size="15.0"> </tspan> = 1.203</text>
<text x="450" y="320" text-anchor="start" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="15" fill="#687986">(4<tspan font-style="italic">e</tspan><tspan dy="-6.3" font-size="10.2">−4</tspan><tspan dy="6.3" font-size="15.0"> </tspan> + 2<tspan font-style="italic">e</tspan><tspan dy="-6.3" font-size="10.2">−2</tspan><tspan dy="6.3" font-size="15.0"> </tspan> + 6<tspan font-style="italic">e</tspan><tspan dy="-6.3" font-size="10.2">−3</tspan><tspan dy="6.3" font-size="15.0"> </tspan> + 1) / 1.203 = <tspan fill="#1f9a74">1.365</tspan></text>
<text x="30" y="352" text-anchor="start" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="15" fill="#253340"><tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">On chip between tiles: only </tspan> (<tspan font-style="italic">m</tspan>, <tspan font-style="italic">ℓ</tspan>, Õ) <tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal"> per query row, i.e. </tspan> B<tspan dy="4.2" font-size="10.2"><tspan font-style="italic">r</tspan></tspan><tspan dy="-4.2" font-size="15.0"> </tspan> (<tspan font-style="italic">d</tspan> + 2) <tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal"> numbers, never the score row.</tspan></text>
</svg>
