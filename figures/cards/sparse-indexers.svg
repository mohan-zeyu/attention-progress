<text x="30" y="330.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#253340">Same budget, cheaper scorer: every design reads ≈ 2,048 tokens per query.</text>
<text x="30" y="348.9" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#253340">The O(N) indexer pass is what is left to cut: fewer heads (MSA, QSA), pooled keys (QSA, CSA), shared layers (IndexShare).</text>
<text x="30" y="384" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#687986">index head dim 128 for DSA, CSA, QSA (CSA in FP4); MSA index dim not stated · MSA reads 16 blocks per GQA group</text>
