<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">sparse-indexers</title><desc id="desc">Index dot products per query per layer at N = 1M, counted as heads times keys scored divided by layers sharing one indexer: DSA 64 heads over every token, 64M; IndexShare in GLM-5.2 reuses one indexer for 4 sparse layers, 16M; DeepSeek-V4-Flash CSA scores 1M/4 compressed entries with 64 heads, 16M; MSA uses one index head per GQA group (4) over every token, 4M; QSA scores 4-token pooled keys with 4 heads, 1M. Every design reads about 2,048 tokens per query in the main attention.</desc>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#253340"/></marker>
