<title id="title">ttt-recall-gap</title><desc id="desc">Left: reported in-context recall average (MesaNet Table 3, 1B models, 50B tokens, 2K context): Mamba2 37.67, GLA 39.64, Gated DeltaNet 39.54, DeltaNet 40.46, Mesa 41.79, SWA-1024 40.84, Transformer 52.27. Right: reported pass-key retrieval (TTT-E2E Table 2, 3B models): full attention stays at 1.00 to 0.99 from 8K to 128K, while TTT-E2E falls 1.00, 0.46, 0.24, 0.13, 0.06, tracking 8K/N, the share of needles inside its 8K window.</desc>
