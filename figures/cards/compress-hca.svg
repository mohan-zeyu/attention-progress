<text x="30" y="36" text-anchor="start" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="20" fill="#253340"><tspan fill="#3f83b6"><tspan font-style="italic">c</tspan><tspan dy="5.6" font-size="13.6"><tspan font-style="italic">i</tspan></tspan><tspan dy="-5.6" font-size="20.0"> </tspan></tspan> = <tspan font-style="normal">Σ</tspan><tspan dy="5.6" font-size="13.6"><tspan font-style="italic">j</tspan> ∈ <tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">blk</tspan><tspan dy="3.8" font-size="9.2"><tspan font-style="italic">i</tspan></tspan><tspan dy="-3.8" font-size="13.6"> </tspan></tspan><tspan dy="-5.6" font-size="20.0"> </tspan> <tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">softmax</tspan><tspan dy="5.6" font-size="13.6"><tspan font-style="italic">j</tspan></tspan><tspan dy="-5.6" font-size="20.0"> </tspan>(<tspan fill="#2a9aa6"><tspan font-style="italic">z</tspan><tspan dy="5.6" font-size="13.6"><tspan font-style="italic">j</tspan></tspan><tspan dy="-5.6" font-size="20.0"> </tspan> + B<tspan dy="5.6" font-size="13.6"><tspan font-style="italic">j</tspan></tspan><tspan dy="-5.6" font-size="20.0"> </tspan></tspan>) <tspan font-style="normal">⊙</tspan> <tspan font-style="italic">x</tspan><tspan dy="5.6" font-size="13.6"><tspan font-style="italic">j</tspan></tspan><tspan dy="-5.6" font-size="20.0"> </tspan>,   |<tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">blk</tspan><tspan dy="5.6" font-size="13.6"><tspan font-style="italic">i</tspan></tspan><tspan dy="-5.6" font-size="20.0"> </tspan>| = 128</text>
<text x="529.97696" y="36" text-anchor="start" font-family="STIX Two Math,Cambria Math,Times New Roman,serif" font-size="20" fill="#253340"><tspan font-style="italic">A</tspan><tspan dy="5.6" font-size="13.6"><tspan font-style="italic">t</tspan></tspan><tspan dy="-5.6" font-size="20.0"> </tspan> = { <tspan font-style="italic">c</tspan><tspan dy="5.6" font-size="13.6"><tspan font-style="italic">s</tspan></tspan><tspan dy="-5.6" font-size="20.0"> </tspan> : <tspan font-style="italic">s</tspan> &lt; ⌊<tspan font-style="italic">t</tspan>/128⌋ } ∪ <tspan font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-style="normal">win</tspan><tspan dy="5.6" font-size="13.6">128</tspan><tspan dy="-5.6" font-size="20.0"> </tspan></text>
