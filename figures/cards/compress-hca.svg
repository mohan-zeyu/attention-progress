<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">compress-hca</title><desc id="desc">HCA in DeepSeek-V4: every 128 tokens become one entry with no overlap, and queries read all entries densely plus a 128-token raw window. Entries read per query: at 8K, MLA 8,192, CSA 1,152, HCA 192; at 128K, 131,072, 1,152 and 1,152; at 1M, 1,048,576, 1,152 and 8,320. CSA also pays an indexer pass over N/4 entries.</desc>
