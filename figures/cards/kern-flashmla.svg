<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" role="img" aria-labelledby="title desc">
<title id="title">kern-flashmla</title><desc id="desc">FlashMLA runs absorbed MLA decode as MQA: 128 query heads become 128 rows of one matmul against a single 576-wide latent per token (512 latent plus 64 RoPE dims). Each cached token then serves 128 × 2 × (576 + 512) = 278,528 FLOPs: about 242 FLOP per byte in BF16 (1,152 B) and 425 in FP8 (656 B), against 1 for MHA, 8 for GQA-8 and an H100 ridge of about 295. Reported on H800: 3000 GB/s memory-bound, 580 then 660 TFLOP/s compute-bound. FlashInfer stores a ragged, paged batch as one block-sparse matrix.</desc>
