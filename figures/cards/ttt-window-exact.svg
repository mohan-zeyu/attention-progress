<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" role="img" aria-labelledby="title desc">
<title id="title">ttt-window-exact</title><desc id="desc">Which past pairs the memory is fit to. Delta rule: only token t, one gradient step. ATLAS: the last c tokens with gates gamma, Muon (Newton-Schulz) steps. Mesa: every past token with discount zeta, solved exactly by conjugate gradient. Toy with correlated keys k1 = [1, 0], k2 = [0.6, 0.8], values +1 and -1: reading at k1 gives 0.40 (linear attention), 0.04 (DeltaNet), 1.00 (Mesa). Mesa costs about k times GLA FLOPs for k CG steps; a stopping rule eps = 1e-4 matches 30 fixed steps with about 9 on average.</desc>
