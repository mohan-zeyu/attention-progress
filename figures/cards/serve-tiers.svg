<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">serve-tiers</title><desc id="desc">Where cached KV can live, with typical bandwidths of an H100-class node (spec values): HBM3 3,350 GB/s, NVLink 900 GB/s, PCIe 5 x16 64 GB/s per direction, a 400 Gb/s RDMA NIC 50 GB/s, one Gen4 NVMe SSD about 7 GB/s. Reloading a 32K-token DeepSeek-V3.2 FP8 prefix (1.22 GiB) takes 0.39 ms, 1.5 ms, 20 ms, 26 ms or 187 ms, all far below the roughly 2.5 GPU-seconds needed to recompute its prefill at H100 BF16 peak (computed). Reported: 56.3% of DeepSeek input tokens hit its on-disk cache; LMCache up to 15× throughput with vLLM.</desc>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#253340"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#687986"/></marker>
