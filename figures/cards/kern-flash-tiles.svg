<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" role="img" aria-labelledby="title desc">
<title id="title">kern-flash-tiles</title><desc id="desc">FlashAttention keeps Q, K, V and O in HBM and streams tiles through on-chip SRAM, so the N×N score and probability matrices are never written. A100: HBM 1.5–2.0 TB/s, SRAM 192 KB per SM at about 19 TB/s. Example tiles of 128 rows with d = 64 fit in 144 KiB. Reported for GPT-2 medium attention (N = 1024, d = 64) on A100: HBM traffic 40.3 GB to 4.4 GB, runtime 41.7 ms to 7.3 ms, while FLOPs rise from 66.6 to 75.2 G because of recomputation.</desc>
