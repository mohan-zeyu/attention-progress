<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">mla-heads</title><desc id="desc">Head count changes FLOPs, not cache. DeepSeek-V3 (128 heads) and Kimi K2 (64 heads) cache the same 576 elements per token and layer. Decode FLOPs per cached token per layer: 278,528 versus 139,264; intensity in BF16 about 242 versus 121 FLOP/B, against an H100 ridge of 295. Kimi K2 reports that 64 to 128 heads costs +83% inference FLOPs at 128K for 0.5 to 1.2% lower validation loss.</desc>
