<title id="title">compress-v4</title><desc id="desc">DeepSeek-V4 layer layouts from config.json: Flash has 2 sliding-window-only layers, then 21 CSA and 20 HCA layers alternating; Pro has 2 HCA layers, then 30 CSA and 29 more HCA layers. Derived main-KV bytes per token (576-byte entries, scales and indexer keys left out): Pro about 4,460 B, Flash about 3,114 B, versus 40,016 B for DeepSeek-V3.2 MLA in FP8 and 249,856 B for a BF16 GQA8 baseline.</desc>
