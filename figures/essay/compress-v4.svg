<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 196" role="img" aria-labelledby="title desc">
<title id="title">compress-v4</title><desc id="desc">DeepSeek-V4 compression on a toy cache of 52 tokens. CSA emits one entry every 4 tokens, each pooling 8 tokens so neighbours overlap; an indexer picks the top 3 entries. HCA emits one entry every 16 tokens (128 in the real model) and reads them all. Both also read the last 4 raw tokens.</desc>
