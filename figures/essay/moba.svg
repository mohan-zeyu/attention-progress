<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 226" role="img" aria-labelledby="title desc">
<title id="title">moba</title><desc id="desc">MoBA on a toy cache of 32 tokens in 8 blocks of 4. Each block is summarised by its mean key. The query (last token) scores every earlier block with one dot product against the mean key, keeps the top 2 (blocks 2 and 4) plus its own block, and reads only the tokens of those 3 blocks; the rest stay in the cache unread.</desc>
