<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 178" role="img" aria-labelledby="title desc">
<title id="title">snapkv</title><desc id="desc">SnapKV on a toy 40-token prompt. The last 8 tokens (the observation window) vote with their attention over the earlier 32. Votes are max-pooled over neighbours, so the tokens next to a peak are kept too. The top 9 positions plus the window stay; the rest of the prompt is evicted.</desc>
