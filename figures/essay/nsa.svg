<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-labelledby="title desc">
<title id="title">nsa</title><desc id="desc">NSA on a toy cache of 40 tokens. Compressed branch: every 4 tokens become one record, all read, shaded by the query&#x27;s attention. Selected branch: blocks of 8; the first and local blocks are always read, and block 2 is picked because its compressed records scored highest. Window branch: the last 6 tokens. A gate adds the three results.</desc>
