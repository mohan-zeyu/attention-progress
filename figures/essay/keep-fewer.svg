<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 166" role="img" aria-labelledby="title desc">
<title id="title">keep-fewer</title><desc id="desc">A toy cache of 32 tokens, where token 9 will be needed by a later question. Eviction keeps 10 exact records (a few important ones plus the recent ones) and deletes token 9 for good. Compression keeps 8 records, each merging 4 tokens, so token 9 survives only blurred inside a merged record.</desc>
