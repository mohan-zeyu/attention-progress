<title id="title">dsa</title><desc id="desc">DSA on a toy cache of 40 tokens. Every token keeps a small indexer key; the lightning indexer scores all of them for the query, and only the top 8 tokens, scattered anywhere in the cache, are read by the main attention.</desc>
